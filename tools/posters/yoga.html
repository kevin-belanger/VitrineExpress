<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Affiche</title>
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; background: linear-gradient(135deg, #0f4c45 0%, #14837a 55%, #5fcfc0 100%); position: relative; }
.c1, .c2 { position: absolute; border-radius: 50%; background: rgba(255,255,255,.10); }
.c1 { width: 1100px; height: 1100px; right: -380px; bottom: -520px; }
.c2 { width: 520px; height: 520px; right: 180px; top: -260px; background: rgba(255,255,255,.07); }
.box { position: absolute; left: 150px; top: 230px; width: 1400px; }
.kicker { font-size: 46px; letter-spacing: .18em; text-transform: uppercase; opacity: .85; margin: 0 0 24px; font-weight: 600; }
h1 { font-size: 184px; line-height: 1; margin: 0 0 48px; font-weight: 800; letter-spacing: -.02em; }
.when { font-size: 78px; font-weight: 600; margin: 0 0 20px; }
.where { font-size: 54px; opacity: .9; margin: 0; }
.bar { position: absolute; left: 150px; bottom: 120px; width: 220px; height: 12px; border-radius: 6px; background: #fff; opacity: .9; }
</style></head>
<body>
<div class="c1"></div><div class="c2"></div>
<div class="box">
  <p class="kicker">Activité hebdomadaire</p>
  <h1>Cours de yoga</h1>
  <p class="when">Tous les mardis, 18 h 30</p>
  <p class="where">Gymnase · Inscription à l’accueil</p>
</div>
<div class="bar"></div>
</body></html>
