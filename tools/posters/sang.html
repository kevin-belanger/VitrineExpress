<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Affiche</title>
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; background: linear-gradient(135deg, #7a1424 0%, #c62839 50%, #f2784b 100%); position: relative; }
.heart { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); font-size: 760px; line-height: 1; opacity: .16; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; }
.box { position: absolute; left: 150px; top: 230px; width: 1500px; }
.kicker { font-size: 46px; letter-spacing: .18em; text-transform: uppercase; opacity: .85; margin: 0 0 24px; font-weight: 600; }
h1 { font-size: 150px; line-height: 1; margin: 0 0 44px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.when { font-size: 74px; font-weight: 600; margin: 0 0 18px; }
.where { font-size: 52px; opacity: .92; margin: 0; }
.pill { position: absolute; left: 150px; bottom: 96px; padding: 18px 44px; border-radius: 60px; background: #fff; color: #a21c2f; font-size: 44px; font-weight: 700; }
</style></head>
<body>
<div class="heart">&#9829;</div>
<div class="box">
  <p class="kicker">Héma-Québec au centre</p>
  <h1>Collecte de sang</h1>
  <p class="when">Jeudi 16 octobre, 9 h à 16 h</p>
  <p class="where">Salle polyvalente · Sur rendez-vous à l’accueil</p>
</div>
<div class="pill">Un don, trois vies</div>
</body></html>
