<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Affiche</title>
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; background: linear-gradient(160deg, #081a33 0%, #10306e 55%, #081a33 100%); position: relative; }
.star { position: absolute; color: #fcd34d; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; line-height: 1; }
.box { position: absolute; left: 150px; top: 240px; width: 1500px; }
.kicker { font-size: 46px; letter-spacing: .18em; text-transform: uppercase; color: #fcd34d; margin: 0 0 24px; font-weight: 600; }
h1 { font-size: 184px; line-height: 1; margin: 0 0 48px; font-weight: 800; letter-spacing: -.02em; color: #fde68a; }
.when { font-size: 78px; font-weight: 600; margin: 0 0 20px; }
.where { font-size: 54px; opacity: .9; margin: 0; }
.ring { position: absolute; right: -200px; top: -200px; width: 900px; height: 900px; border-radius: 50%; border: 90px solid rgba(252, 211, 77, .12); }
</style></head>
<body>
<div class="ring"></div>
<div class="star" style="left: 1480px; top: 140px; font-size: 90px;">&#10022;</div>
<div class="star" style="left: 1640px; top: 420px; font-size: 54px; opacity: .8;">&#10022;</div>
<div class="star" style="left: 1320px; top: 760px; font-size: 70px; opacity: .7;">&#10022;</div>
<div class="star" style="left: 1760px; top: 880px; font-size: 44px; opacity: .6;">&#10022;</div>
<div class="box">
  <p class="kicker">Samedi 6 décembre</p>
  <h1>Marché de Noël</h1>
  <p class="when">De 10 h à 17 h · Entrée libre</p>
  <p class="where">40 artisans d’ici · Chocolat chaud offert aux enfants</p>
</div>
</body></html>
